databases:
  - name: yos-membership-db
    databaseName: yos_membership
    user: yos_membership
    plan: 0.1c-256mb
    region: ohio
    postgresMajorVersion: "17"
    ipAllowList: []

services:
  - type: web
    name: yos-membership-api
    runtime: node
    rootDir: membership-api
    region: ohio
    plan: starter
    buildCommand: npm install --omit=dev
    startCommand: npm run deploy
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: yos-membership-db
          property: connectionString
      - key: YOS_ADMIN_KEY
        generateValue: true
      - key: SESSION_HOURS
        value: "24"
      - key: LOGIN_ATTEMPTS_PER_15_MIN
        value: "10"
      - key: ALLOWED_ORIGINS
        value: https://appassets.androidplatform.net
      - key: PGSSLMODE
        value: require
