name: Compilar aplicaciones Android YOS

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar APK
        run: gradle assembleDebug

      - name: Guardar APK para descargar
        uses: actions/upload-artifact@v4
        with:
          name: YOS-1.1-CELULAR-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Guardar APK Xtream para descargar
        uses: actions/upload-artifact@v4
        with:
          name: YOS-2.12-XTREAM-ANDROID-APK
          path: xtream/build/outputs/apk/debug/xtream-debug.apk
          if-no-files-found: error

      - name: Guardar APK YOS Play para descargar
        uses: actions/upload-artifact@v4
        with:
          name: YOS-PLAY-APK
          path: yosplay/build/outputs/apk/debug/yosplay-debug.apk
          if-no-files-found: error
